<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MMM-voetbal-nl – Lokale test</title>
  <style>
    body {
      background-color: #000;
      color: #fff;
      font-family: "Roboto Condensed", Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      padding: 40px;
      margin: 0;
    }

    /* === Module stijlen (kopie van MMM-voetbal-nl.css) === */
    .mmm-voetbal-nl {
      font-family: inherit;
      text-align: left;
      min-width: 260px;
    }

    .mmm-voetbal-nl .voetbal-title {
      font-size: 1em;
      font-weight: bold;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: #aaa;
      margin-bottom: 10px;
      border-bottom: 1px solid #444;
      padding-bottom: 4px;
    }

    .mmm-voetbal-nl .voetbal-list {
      list-style: none;
      margin: 0;
      padding: 0;
    }

    .mmm-voetbal-nl .voetbal-match {
      display: flex;
      flex-direction: column;
      margin-bottom: 12px;
      padding-bottom: 10px;
      border-bottom: 1px solid #2a2a2a;
    }

    .mmm-voetbal-nl .voetbal-match:last-child {
      border-bottom: none;
      margin-bottom: 0;
    }

    .mmm-voetbal-nl .voetbal-date {
      font-size: 0.75em;
      color: #888;
      margin-bottom: 2px;
    }

    .mmm-voetbal-nl .voetbal-teams {
      font-size: 1em;
      color: #fff;
      font-weight: bold;
    }

    .mmm-voetbal-nl .voetbal-competition {
      font-size: 0.7em;
      color: #666;
      margin-top: 2px;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }
  </style>
</head>
<body>
  <div id="module-output"></div>

  <script>
    // Mock-data: zelfde als in MMM-voetbal-nl.js
    const matches = [
      {
        homeTeam: "Ajax",
        awayTeam: "PSV",
        date: "2026-06-07",
        time: "18:45",
        competition: "Eredivisie",
      },
      {
        homeTeam: "Feyenoord",
        awayTeam: "AZ",
        date: "2026-06-08",
        time: "20:00",
        competition: "Eredivisie",
      },
      {
        homeTeam: "FC Utrecht",
        awayTeam: "NEC",
        date: "2026-06-09",
        time: "19:30",
        competition: "Eredivisie",
      },
    ];

    function renderModule(matches) {
      const wrapper = document.createElement("div");
      wrapper.className = "mmm-voetbal-nl";

      const title = document.createElement("div");
      title.className = "voetbal-title";
      title.innerText = "Volgende Wedstrijden";
      wrapper.appendChild(title);

      const list = document.createElement("ul");
      list.className = "voetbal-list";

      matches.forEach((match) => {
        const item = document.createElement("li");
        item.className = "voetbal-match";

        const dateEl = document.createElement("span");
        dateEl.className = "voetbal-date";
        dateEl.innerText = `${match.date} ${match.time}`;

        const teamsEl = document.createElement("span");
        teamsEl.className = "voetbal-teams";
        teamsEl.innerText = `${match.homeTeam} – ${match.awayTeam}`;

        const compEl = document.createElement("span");
        compEl.className = "voetbal-competition";
        compEl.innerText = match.competition;

        item.appendChild(dateEl);
        item.appendChild(teamsEl);
        item.appendChild(compEl);
        list.appendChild(item);
      });

      wrapper.appendChild(list);
      return wrapper;
    }

    document.getElementById("module-output").appendChild(renderModule(matches));
  </script>
</body>
</html>
